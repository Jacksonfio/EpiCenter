version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: epicenter_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: epicenter
      POSTGRES_PASSWORD: epicenter_secret
      POSTGRES_DB: epicenter_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epicenter -d epicenter_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: epicenter_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  minio:
    image: minio/minio:latest
    container_name: epicenter_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: epicenter_minio
      MINIO_ROOT_PASSWORD: epicenter_minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  ingestion:
    build:
      context: .
      dockerfile: ./cmd/ingestion/Dockerfile
    container_name: epicenter_ingestion
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://epicenter:epicenter_secret@postgres:5432/epicenter_db
      - TRIGGER_DEV_SECRET_KEY=${TRIGGER_DEV_SECRET_KEY}
      - TRIGGER_DEV_API_URL=${TRIGGER_DEV_API_URL}
      - VAULT_ADDR=${VAULT_ADDR}
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
